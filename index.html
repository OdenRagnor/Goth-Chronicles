<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gothic Chronicle</title>
    <style>
        /* Gothic Color Palette & Typography */
        body { 
            font-family: "Garamond", "Baskerville", "Georgia", serif; 
            max-width: 850px; 
            margin: 40px auto; 
            padding: 0 20px; 
            color: #c5c5c5; 
            background-color: #0b0c10;
            background-image: radial-gradient(#1f2128 10%, #0b0c10 90%);
        }

        .feed-container { 
            background: #12141a;
            border: 2px solid #5a1111;
            border-radius: 4px; 
            padding: 30px; 
            box-shadow: 0 0 25px rgba(90, 17, 17, 0.4); 
        }

        h2 {
            font-size: 2.2rem;
            text-align: center;
            letter-spacing: 2px;
            color: #8b0000;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 8px rgba(139, 0, 0, 0.6);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px double #5a1111;
            padding-bottom: 15px;
            font-weight: normal;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: #0b0c10;
            color: #888;
            border: 1px solid #444;
            padding: 8px 16px;
            font-family: "Garamond", serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-btn:hover, .filter-btn.active {
            color: #ff3333;
            border-color: #8b0000;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.5);
        }

        .feed-item { 
            margin-bottom: 30px; 
            padding-bottom: 25px; 
            border-bottom: 1px solid #2a1111;
            transition: all 0.3s ease;
        }
        
        .feed-item:last-child { 
            margin-bottom: 0; 
            padding-bottom: 0; 
            border-bottom: none; 
        }

        h3 { 
            margin: 0 0 10px 0; 
            font-size: 1.4rem; 
            font-weight: normal;
        }
        
        a { 
            color: #8b0000; 
            text-decoration: none; 
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }
        
        a:hover { 
            color: #ff3333;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }

        .source-tag {
            color: #7a1111;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        p { 
            color: #9da3a8; 
            line-height: 1.6; 
            margin: 0; 
            font-style: italic;
        }

        .meta { 
            font-size: 0.8rem; 
            color: #555c66; 
            margin-top: 10px; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #rss-feed {
            font-size: 1.1rem;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="feed-container">
        <h2>✙ The Gothic Chronicle ✙</h2>
        
        <div class="filters">
            <button class="filter-btn active" onclick="filterFeeds('all', event)">All Scrolls</button>
            <button class="filter-btn" onclick="filterFeeds('horror', event)">Horror & Reviews</button>
            <button class="filter-btn" onclick="filterFeeds('crime', event)">True Crime</button>
            <button class="filter-btn" onclick="filterFeeds('death', event)">Death & Obituaries</button>
        </div>

        <div id="rss-feed">Summoning all historical scrolls...</div>
    </div>

    <script>
        // =========================================================================
        // STREAM 1: TRUE CRIME FEEDS (EXACT DIRECT FETCH - UNCHANGED)
        // =========================================================================
        const CRIME_FEEDS = [
            { name: "True Crime News", category: "crime", url: "https://feeds.truecrimenews.com/rss/" },
            { name: "Oxygen True Crime", category: "crime", url: "https://www.oxygen.com/feeds/crime-news" },
            { name: "Investigation Digest", category: "crime", url: "https://investigationdigest.com/feed" },
            { name: "TrueCrime News", category: "crime", url: "https://truecrime.news/feed.xml" },
            { name: "Daily Crime", category: "crime", url: "https://www.dailycrime.com/feed/" },  
            { name: "True Crime Society", category: "crime", url: "https://truecrimesociety.com/feed/" },  
            { name: "Horror Stories Times", category: "crime", url: "https://media.rss.com/horror-stories-times/feed.xml" },  
            { name: "Mord und Mythos", category: "crime", url: "https://media.rss.com/mord-und-mythos/feed.xml" },  
            { name: "Mr. Nightmare", category: "crime", url: "https://media.rss.com/mr-nightmare-pod2/feed.xml" },  
            { name: "Crimes & Chaos", category: "crime", url: "https://media.rss.com/crimes-chaos-pod1/feed.xml" },  
            { name: "Strange Nightmares Cafe", category: "crime", url: "https://media.rss.com/strangenightmares/feed.xml" },
            { name: "Dateline NBC", category: "crime", url: "https://feeds.simplecast.com/65_u_t72" },
            { name: "Morbid: True Crime", category: "crime", url: "https://feeds.simplecast.com/iddhH_fD" },
            { name: "MrBallen Dark Stories", category: "crime", url: "https://feeds.simplecast.com/i9xiph9o" },
            { name: "Last Podcast on the Left", category: "crime", url: "https://feeds.simplecast.com/i78z97y0" },
            { name: "Crime Online News", category: "crime", url: "https://www.crimeonline.com/feed/" }
        ];

        // =========================================================================
        // STREAM 2: HORROR & OBITUARIES (ORIGINAL WORKING CONFIGURATION)
        // =========================================================================
        const CLASSIC_FEEDS = [
            // --- HORROR CATEGORY ---
            { name: "Bloody Disgusting", category: "horror", url: "https://bloody-disgusting.com/feed/" },
            { name: "Dread Central", category: "horror", url: "https://www.dreadcentral.com/feed/" },
            { name: "Horror News Net", category: "horror", url: "https://horrornewsnet.com/feed/" },
            { name: "Epic Film Guys Reviews", category: "horror", url: "https://epicfilmguys.podbean.com/feed/" },
            { name: "Nightmare Magazine Fiction", category: "horror", url: "https://www.nightmare-magazine.com/feed/" },

            // --- DEATH & OBITUARIES ---
            { name: "The Guardian Obituaries", category: "death", url: "https://www.theguardian.com/tone/obituaries/rss" },
            { name: "MIT Memorials", category: "death", url: "https://news.mit.edu/rss/topic/obituaries" },
            { name: "Western Wayne Daily", category: "death", url: "https://westernwaynenews.com/obituaries/feed/" },
            { name: "Turner Funeral Announcements", category: "death", url: "https://turnerfamilyfuneral.com/category/obituaries/feed/" }
        ];

        // Restored exact base endpoint that previously functioned
        const ORIGINAL_PARSER_BASE = 'https://api.rss2json.com/v1/api.json?rss_url=';

        let globalArticles = [];
        let currentFilter = 'all';

        // -------------------------------------------------------------------------
        // ENGINE 1: DIRECT FETCHER & XML PARSER FOR TRUE CRIME (100% UNCHANGED)
        // -------------------------------------------------------------------------
        function parseRawFeedXML(xmlText, feed) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            
            if (xmlDoc.querySelector("parsererror")) {
                throw new Error("Invalid XML payload");
            }

            const items = xmlDoc.querySelectorAll("item, entry");
            const parsed = [];

            items.forEach(item => {
                const title = item.querySelector("title")?.textContent?.trim() || "Untitled Fragment";
                
                let link = "#";
                const linkElem = item.querySelector("link");
                if (linkElem) {
                    link = linkElem.getAttribute("href") || linkElem.textContent?.trim() || "#";
                }

                let description = item.querySelector("description, summary, content")?.textContent || "";
                description = description.replace(/<\/?[^>]+(>|$)/g, "").replace(/\s+/g, " ").trim();

                const pubDateStr = item.querySelector("pubDate, published, updated")?.textContent?.trim() || new Date().toISOString();
                let pubDateParsed = new Date(pubDateStr);
                if (isNaN(pubDateParsed.getTime())) {
                    pubDateParsed = new Date();
                }

                parsed.push({
                    title,
                    link,
                    description,
                    pubDateParsed,
                    sourceName: feed.name,
                    category: feed.category
                });
            });

            return parsed;
        }

        async function fetchCrimeDirect(feed) {
            try {
                const response = await Promise.race([
                    fetch(feed.url, { method: 'GET', mode: 'cors' }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 8000))
                ]);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const xmlText = await response.text();
                return parseRawFeedXML(xmlText, feed);
            } catch (err) {
                console.warn(`[Crime Direct Stream] ${feed.name}:`, err.message);
                return [];
            }
        }

        // -------------------------------------------------------------------------
        // ENGINE 2: RESTORED ORIGINAL WORKING FETCHER FOR HORROR & DEATH
        // -------------------------------------------------------------------------
        async function fetchClassicFeed(feed) {
            try {
                // Fetch directly through standard rss2json without invalid count params
                const response = await fetch(ORIGINAL_PARSER_BASE + encodeURIComponent(feed.url));
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                if (data.status !== 'ok' || !data.items) return [];

                // Pull and return every single article supplied by the feed
                return data.items.map(item => {
                    let pubDateParsed = new Date(item.pubDate);
                    if (isNaN(pubDateParsed.getTime())) pubDateParsed = new Date();

                    let description = (item.description || "").replace(/<\/?[^>]+(>|$)/g, "").replace(/\s+/g, " ").trim();

                    return {
                        title: item.title || "Untitled Fragment",
                        link: item.link || "#",
                        description: description,
                        pubDateParsed: pubDateParsed,
                        sourceName: feed.name,
                        category: feed.category
                    };
                });
            } catch (err) {
                console.warn(`[Classic Stream] ${feed.name}:`, err.message);
                return [];
            }
        }

        // -------------------------------------------------------------------------
        // ORCHESTRATION & RENDERING
        // -------------------------------------------------------------------------
        async function loadAllFeeds() {
            // Stream 1: Exact Crime processing
            CRIME_FEEDS.forEach(async (feed) => {
                const articles = await fetchCrimeDirect(feed);
                if (articles.length > 0) {
                    globalArticles = globalArticles.concat(articles);
                    globalArticles.sort((a, b) => b.pubDateParsed - a.pubDateParsed);
                    renderActiveCategory();
                }
            });

            // Stream 2: Restored Classic processing (Horror & Death)
            CLASSIC_FEEDS.forEach(async (feed) => {
                const articles = await fetchClassicFeed(feed);
                if (articles.length > 0) {
                    globalArticles = globalArticles.concat(articles);
                    globalArticles.sort((a, b) => b.pubDateParsed - a.pubDateParsed);
                    renderActiveCategory();
                }
            });
        }

        function renderActiveCategory() {
            if (currentFilter === 'all') {
                renderArticles(globalArticles);
            } else {
                const filtered = globalArticles.filter(art => art.category === currentFilter);
                renderArticles(filtered);
            }
        }

        function renderArticles(articlesList) {
            const container = document.getElementById('rss-feed');
            
            if (articlesList.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #666; font-style: italic;">The void is empty. No scrolls match this category.</p>`;
                return;
            }

            let html = '';
            for (let i = 0; i < articlesList.length; i++) {
                const article = articlesList[i];
                const pubDate = article.pubDateParsed.toLocaleDateString(undefined, { 
                    weekday: 'short', 
                    month: 'short', 
                    day: 'numeric',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                html += `
                    <div class="feed-item" data-category="${article.category}">
                        <div class="source-tag">✙ Category: ${article.category.toUpperCase()} | Source: ${article.sourceName} ✙</div>
                        <h3><a href="${article.link}" target="_blank" rel="noopener">✠ ${article.title}</a></h3>
                        <p>${article.description || 'No excerpt available.'}</p>
                        <div class="meta">Emanated on: ${pubDate}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function filterFeeds(category, event) {
            currentFilter = category;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            renderActiveCategory();
        }

        loadAllFeeds();
    </script>
</body>
</html>
