<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gothic Chronicle</title>
    <style>
        /* Gothic Color Palette & Typography */
        body { 
            font-family: "Garamond", "Baskerville", "Georgia", serif; 
            max-width: 850px; 
            margin: 40px auto; 
            padding: 0 20px; 
            color: #c5c5c5; 
            background-color: #0b0c10; /* Velvet black */
            background-image: radial-gradient(#1f2128 10%, #0b0c10 90%);
        }

        /* Ornate container mimicking an ancient tome */
        .feed-container { 
            background: #12141a; /* Dark iron */
            border: 2px solid #5a1111; /* Dried blood red */
            border-radius: 4px; 
            padding: 30px; 
            box-shadow: 0 0 25px rgba(90, 17, 17, 0.4); 
        }

        /* Ornate Gothic Header */
        h2 {
            font-size: 2.2rem;
            text-align: center;
            letter-spacing: 2px;
            color: #8b0000; /* Deep crimson */
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 8px rgba(139, 0, 0, 0.6);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px double #5a1111;
            padding-bottom: 15px;
            font-weight: normal;
        }

        /* Interactive Filter Bar */
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: #0b0c10;
            color: #888;
            border: 1px solid #444;
            padding: 8px 16px;
            font-family: "Garamond", serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-btn:hover, .filter-btn.active {
            color: #ff3333;
            border-color: #8b0000;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.5);
        }

        /* Feed Item Layout */
        .feed-item { 
            margin-bottom: 30px; 
            padding-bottom: 25px; 
            border-bottom: 1px solid #2a1111; /* Subtle crimson partition */
            transition: all 0.3s ease;
        }
        
        .feed-item:last-child { 
            margin-bottom: 0; 
            padding-bottom: 0; 
            border-bottom: none; 
        }

        /* Article Titles as Gothic Links */
        h3 { 
            margin: 0 0 10px 0; 
            font-size: 1.4rem; 
            font-weight: normal;
        }
        
        a { 
            color: #8b0000; 
            text-decoration: none; 
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }
        
        a:hover { 
            color: #ff3333; /* Glow crimson on hover */
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }

        /* Source Tag */
        .source-tag {
            color: #7a1111;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* Article Excerpt */
        p { 
            color: #9da3a8; 
            line-height: 1.6; 
            margin: 0; 
            font-style: italic; /* Romanticist literary style */
        }

        /* Metadata (Dates) */
        .meta { 
            font-size: 0.8rem; 
            color: #555c66; 
            margin-top: 10px; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Loading / Status */
        #rss-feed {
            font-size: 1.1rem;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="feed-container">
        <h2>✙ The Gothic Chronicle ✙</h2>
        
        <!-- Interactive Category Toggle Buttons -->
        <div class="filters">
            <button class="filter-btn active" onclick="filterFeeds('all')">All Scrolls</button>
            <button class="filter-btn" onclick="filterFeeds('horror')">Horror & Reviews</button>
            <button class="filter-btn" onclick="filterFeeds('crime')">True Crime</button>
            <button class="filter-btn" onclick="filterFeeds('death')">Death & Obituaries</button>
        </div>

        <div id="rss-feed">The spirits are whispering, retrieving scrolls...</div>
    </div>
</body>
    <script>
        const FEEDS = [
        
            // HORROR
            {
                name: "Bloody Disgusting",
                category: "horror",
                url: "https://bloody-disgusting.com/feed/"
            },
            {
                name: "Dread Central",
                category: "horror",
                url: "https://www.dreadcentral.com/feed/"
            },
            {
                name: "Horror News Net",
                category: "horror",
                url: "https://horrornewsnet.com/feed/"
            },
            {
                name: "Nightmare Magazine",
                category: "horror",
                url: "https://www.nightmare-magazine.com/feed/"
            },
        
            // TRUE CRIME
            {
                name: "Crime Online",
                category: "crime",
                url: "https://www.crimeonline.com/feed/"
            },
            {
                name: "Dateline NBC",
                category: "crime",
                url: "https://feeds.simplecast.com/65\_u\_t72"
            },
            {
                name: "Morbid",
                category: "crime",
                url: "https://feeds.simplecast.com/iddhH\_fD"
            },
            {
                name: "MrBallen",
                category: "crime",
                url: "https://feeds.simplecast.com/i9xiph9o"
            },
            {
                name: "Last Podcast on the Left",
                category: "crime",
                url: "https://feeds.simplecast.com/i78z97y0"
            },
            {
                name: "True Crime Society",
                category: "crime",
                url: "https://truecrimesocietyblog.com/feed/"
            },
        
            // DEATH
            {
                name: "The Guardian Obituaries",
                category: "death",
                url: "https://www.theguardian.com/tone/obituaries/rss"
            },
            {
                name: "MIT Memorials",
                category: "death",
                url: "https://news.mit.edu/rss/topic/obituaries"
            },
            {
                name: "Western Wayne Daily",
                category: "death",
                url: "https://westernwaynenews.com/obituaries/feed/"
            }
        ];
        
        const PARSER_API_BASE =
            "https://api.rss2json.com/v1/api.json?rss\_url=";
        
        const CACHE_KEY = "gothic-feed-cache";
        const CACHE_MINUTES = 15;
        
        let globalArticles = [];
        
        function sanitizeDescription(text = "") {
            return text
                .replace(/<[^>]*>/g, "")
                .replace(/\s+/g, " ")
                .trim()
                .substring(0, 250);
        }
        
        function safeTimestamp(dateStr) {
            const stamp = new Date(dateStr).getTime();
            return isNaN(stamp) ? 0 : stamp;
        }
        
        function saveCache() {
            localStorage.setItem(
                CACHE_KEY,
                JSON.stringify({
                    timestamp: Date.now(),
                    articles: globalArticles
                })
            );
        }
        
        function loadCache() {
            try {
                const cached =
                    JSON.parse(localStorage.getItem(CACHE_KEY));
        
                if (!cached) return false;
        
                const age =
                    Date.now() - cached.timestamp;
        
                if (age > CACHE_MINUTES * 60 * 1000)
                    return false;
        
                globalArticles = cached.articles || [];
        
                if (globalArticles.length) {
                    renderArticles(globalArticles);
                    return true;
                }
            } catch (err) {
                console.warn("Cache unreadable", err);
            }
        
            return false;
        }
        
        function renderArticles(list) {
        
            const container =
                document.getElementById("rss-feed");
        
            if (!list.length) {
                container.innerHTML = `
                    <p style="text-align:center;color:#666;">
                        The void is empty.
                    </p>
                `;
                return;
            }
        
            const limited = list.slice(0, 150);
        
            let html = "";
        
            limited.forEach(article => {
        
                const title =
                    article.title || "Untitled Fragment";
        
                const description =
                    sanitizeDescription(
                        article.description || ""
                    );
        
                const source =
                    article.sourceName ||
                    "Unknown Source";
        
                const link =
                    article.link || "#";
        
                const date = article.pubDate
                    ? new Date(article.pubDate)
                    : null;
        
                const displayDate =
                    date && !isNaN(date)
                    ? date.toLocaleString()
                    : "Unknown Date";
        
                html += `
                <div class="feed-item">
                    <div class="source-tag">
                        ✙ Category: ${article.category.toUpperCase()}
                        | Source: ${source} ✙
                    </div>
        
                    <h3>
                        <a href="${link}"
                           target="_blank"
                           rel="noopener">
                            ✠ ${title}
                        </a>
                    </h3>
        
                    <p>${description}</p>
        
                    <div class="meta">
                        Emanated on: ${displayDate}
                    </div>
                </div>
                `;
            });
        
            container.innerHTML = html;
        }
        
        function currentFilter() {
            const active =
                document.querySelector(
                    ".filter-btn.active"
                );
        
            return active
                ? active.dataset.category
                : "all";
        }
        
        function renderCurrentFilter() {
        
            const category = currentFilter();
        
            if (category === "all") {
                renderArticles(globalArticles);
                return;
            }
        
            renderArticles(
                globalArticles.filter(
                    item => item.category === category
                )
            );
        }
        
        async function loadFeed(feed) {
        
            try {
        
                const controller =
                    new AbortController();
        
                const timeout = setTimeout(
                    () => controller.abort(),
                    7000
                );
        
                const response = await fetch(
                    PARSER_API_BASE +
                    encodeURIComponent(feed.url),
                    {
                        signal: controller.signal
                    }
                );
        
                clearTimeout(timeout);
        
                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }
        
                const data =
                    await response.json();
        
                if (
                    !data ||
                    data.status !== "ok" ||
                    !data.items
                ) {
                    return;
                }
        
                const articles =
                    data.items.map(item => ({
                        ...item,
                        sourceName: feed.name,
                        category: feed.category
                    }));
        
                globalArticles.push(...articles);
        
                globalArticles.sort(
                    (a, b) =>
                        safeTimestamp(b.pubDate) -
                        safeTimestamp(a.pubDate)
                );
        
                saveCache();
        
                renderCurrentFilter();
        
            } catch (error) {
        
                console.warn(
                    `Feed failed: ${feed.name}`,
                    error
                );
        
            }
        }
        
        async function loadAllFeeds() {
        
            document.getElementById(
                "rss-feed"
            ).innerHTML =
                "The spirits are retrieving scrolls...";
        
            loadCache();
        
            FEEDS.forEach(feed =>
                loadFeed(feed)
            );
        }
        
        function initializeFilters() {
        
            document
                .querySelectorAll(".filter-btn")
                .forEach(button => {
        
                    button.addEventListener(
                        "click",
                        () => {
        
                            document
                                .querySelectorAll(
                                    ".filter-btn"
                                )
                                .forEach(btn =>
                                    btn.classList.remove(
                                        "active"
                                    )
                                );
        
                            button.classList.add(
                                "active"
                            );
        
                            renderCurrentFilter();
                        }
                    );
        
                });
        }
        
        initializeFilters();
        loadAllFeeds();
    </script>

</body>
</html>
